<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Claude Tasks</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="panel.css" />
<style>
  .badge { background: rgba(227,184,107,.16); color: var(--warn); }
  body.new .title small { color: var(--ok); }

  #list { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; padding: 4px 8px 6px; min-height: 0; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 18px 8px; text-align: center; }
  .flash { color: var(--muted); font-size: 12px; padding: 8px 6px 2px; }
  .task { display: flex; align-items: flex-start; gap: 9px; padding: 8px 6px; border-radius: 9px; }
  .task:hover { background: var(--panel); }
  .task + .task { border-top: 1px solid rgba(255,255,255,.04); }
  .box { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--faint); flex-shrink: 0; margin-top: 2px; cursor: pointer;
    display: grid; place-items: center; }
  .box:hover { border-color: var(--accent); }
  .task.done .box { background: var(--ok); border-color: var(--ok); }
  .task.done .box::after { content: ""; width: 4px; height: 7px; border: solid #1a1a1a; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .body { flex: 1; min-width: 0; }
  .body .t { font-size: 13px; line-height: 1.35; word-wrap: break-word; }
  .task.done .t { color: var(--muted); text-decoration: line-through; }
  .body .m { font-size: 11px; color: var(--faint); margin-top: 2px; }
  .cat { font-weight: 600; }
  .cat.homework { color: #8fb3e8; } .cat.email { color: var(--accent-2); } .cat.unfinished { color: var(--warn); } .cat.other { color: var(--muted); }
  .from { color: var(--ok); }
  .acts { display: none; gap: 2px; }
  .task:hover .acts { display: flex; }
  .acts .icon-btn { width: 24px; height: 24px; }
  .acts .icon-btn svg { width: 14px; height: 14px; }
  .section { display: flex; align-items: center; gap: 8px; padding: 8px 6px 2px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .section .clear { margin-left: auto; background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 11.5px; }
  .section .clear:hover { color: var(--accent); }

  .addrow { display: flex; gap: 6px; padding: 8px 14px 10px 8px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .addrow input { flex: 1; min-width: 0; padding: 6px 10px; }
  .addrow select { padding: 6px 6px; font-size: 12px; }
  .addrow input[type=date] { flex: 0 0 auto; width: 34px; padding: 6px 4px; color: transparent; cursor: pointer; }
  .addrow input[type=date].set { width: 112px; color: var(--text); }
  input[type=date] { background: var(--panel); border: 1px solid var(--border); border-radius: 9px; font: inherit; font-size: 12px; outline: 0; color-scheme: dark; }
  .due { color: var(--muted); }
  .due.soon { color: var(--warn); font-weight: 600; }
  .due.late { color: #ff9b8a; font-weight: 600; }
  .addrow input[type=time] { display: none; flex: 0 0 auto; width: 96px; padding: 6px 6px; }
  .addrow.has-day input[type=time] { display: block; }
  input[type=time] { font-size: 12px; }
  /* inline due date/time editor under a task */
  .due-edit { display: none; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .task.editing .due-edit { display: flex; }
  .due-edit input { padding: 4px 6px; font-size: 12px; }
  .due-edit input[type=date] { width: 122px; }
  .due-edit input[type=time] { width: 96px; }
  .due-edit .btn { padding: 3px 9px; font-size: 11.5px; }
</style>
</head>
<body>
<div class="shell">
  <div class="phead" title="Drag to move">
    <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L19 7"/></svg></div>
    <div class="title">Tasks <small id="count"></small></div>
    <button class="icon-btn" id="scanBtn" title="Look for new tasks in what I've been doing and in my notes">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
    <button class="icon-btn min" title="Minimize (Ctrl+Shift+Space brings it back)">
      <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  </div>
  <div id="list"></div>
  <div class="addrow">
    <input type="text" id="newTask" placeholder="Add a task…" maxlength="200" />
    <input type="date" id="newDue" title="Due date (optional)" />
    <input type="time" id="newTime" title="Time (optional)" />
    <select id="newCat">
      <option value="other">Other</option>
      <option value="homework">Homework</option>
      <option value="email">Email</option>
      <option value="unfinished">Unfinished</option>
    </select>
  </div>
  <div class="grip" title="Resize"></div>
</div>
<script src="theme.js"></script>
<script src="panel.js"></script>
<script src="tasks.js"></script>
</body>
</html>
